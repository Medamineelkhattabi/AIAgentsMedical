<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Diagnostics AI Agent</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; }
        .container { max-width: 600px; margin-top: 40px; }
        .result { margin-top: 30px; }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4">Medical Diagnostics AI Agent</h1>
    <form method="post">
        <div class="row g-2">
            {% for symptom in symptoms %}
            <div class="col-6">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="{{ symptom }}" value="1" id="{{ symptom }}" {% if selected[symptom] %}checked{% endif %}>
                    <label class="form-check-label" for="{{ symptom }}">
                        {{ symptom.replace('_', ' ').capitalize() }}
                    </label>
                </div>
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary mt-3">Diagnose</button>
    </form>
    {% if diagnosis %}
    <div class="result alert alert-info">
        <strong>Diagnosis:</strong> {{ diagnosis }}<br>
        <strong>Recommendation:</strong> {{ recommendation }}
    </div>
    {% endif %}
</div>
</body>
</html>
